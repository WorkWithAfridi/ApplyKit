<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ApplyKit</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup">
    <main class="panel">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">A</div>
        <div><h1>ApplyKit</h1><p class="eyebrow">YOUR APPLICATION PROFILE</p></div>
      </div>
      <p class="intro">Fill recognized fields on this page using your saved profile.</p>
      <button class="button primary" id="fill-button" type="button">Fill this form <span aria-hidden="true">→</span></button>
      <p class="status" id="status" role="status" aria-live="polite">Your details stay in this browser.</p>
      <div class="divider"></div>
      <button class="button secondary" id="options-button" type="button">Edit profile <span aria-hidden="true">↗</span></button>
      <p class="fine-print">Review the form before submitting. ApplyKit never submits it for you.</p>
    </main>
    <script src="storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
